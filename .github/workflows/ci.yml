name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The index checker resolves row commits and the rendered index's base, so a shallow
          # clone would make every behind count and every ancestry check unanswerable.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - run: bun install --frozen-lockfile

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run verify
        # The gate streams its progress and fails on twelve minutes of silence, so this is headroom
        # for a slow runner rather than the thing that decides a stalled gate.
        timeout-minutes: 30
        env:
          FREEBOT_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts
          path: packages/verify/artifacts/
