<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freebot</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f6f6f4;
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; color: #1b1d22;
  }
  .shell { max-width: 1100px; margin: 0 auto; padding: 0 20px 96px; display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
  .shell[data-operator="false"] { grid-template-columns: 1fr; }
  #sidebar { position: sticky; top: 0; padding: 18px 0 0; }
  #sidebar[hidden] { display: none; }
  #sidebar h2, #threads-title {
    margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #83878f;
  }
  #sidebar-title { margin: 0 0 8px; }
  #bot-list, #thread-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .bot-row, .thread-row {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 13.5px;
    padding: 7px 10px; border: 1px solid #dcdcd6; border-radius: 8px; background: #fff; cursor: pointer;
  }
  .bot-row[data-selected="true"], .thread-row[data-selected="true"] {
    border-color: #1b1d22; background: #eceae4;
  }
  .bot-name, .thread-title { font-weight: 600; }
  .bot-threads, .thread-runs, .thread-detail { font-size: 12px; color: #6b6f78; }
  .thread-detail { font-style: italic; }
  .shell-empty { font-size: 12.5px; color: #83878f; padding: 4px 2px; }
  #new-bot, #new-thread {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid #d4d4ce; background: #fff; cursor: pointer;
  }
  #new-bot-name {
    display: block; width: 100%; margin-bottom: 6px; font: inherit; font-size: 13px;
    padding: 7px 10px; border: 1px solid #d4d4ce; border-radius: 8px; background: #fff;
  }
  #new-bot:disabled, #new-thread:disabled { opacity: 0.45; cursor: default; }
  #threads { margin-top: 18px; }
  #threads-bot { font-size: 12.5px; color: #5c6068; margin: 0 0 6px; }
  #center { min-width: 0; }
  header {
    position: sticky; top: 0; z-index: 2; background: #f6f6f4;
    padding: 18px 0 12px; border-bottom: 1px solid #e2e2dd;
  }
  header h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.01em; }
  header p { margin: 0; font-size: 12px; color: #6b6f78; }
  .meta { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: #5c6068; }
  .meta span { font-variant-numeric: tabular-nums; }
  #resume {
    margin: 14px 0 0; padding: 9px 12px; border: 1px solid #bcd8bc; border-radius: 8px;
    background: #f0f7f0; color: #1f5c1f; font-size: 13px;
  }
  #error {
    margin: 14px 0 0; padding: 9px 12px; border: 1px solid #e3a1a1; border-radius: 8px;
    background: #fdeeee; color: #8d1d1d; font-size: 13px; font-weight: 600;
  }
  #thread { padding-top: 8px; }
  .idle { margin: 20px 0; font-size: 13px; color: #83878f; }
  .frame { display: block; }
  .message.user {
    margin: 18px 0 10px; padding: 12px 14px; background: #e9e9e4; border-radius: 12px;
    align-self: flex-end;
  }
  .message.user .prompt { white-space: pre-wrap; }
  .turn { margin-top: 20px; }
  .turn-title { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #83878f; }
  .assistant { padding-left: 2px; }
  .delta { white-space: pre-wrap; }
  .tool-card {
    display: block; margin: 12px 0; padding: 12px; border: 1px solid #dcdcd6; border-radius: 10px;
    background: #fff;
  }
  .tool-card.destructive { border-color: #dcb253; background: #fffdf3; }
  .tool-card .cmd {
    display: block; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; background: #f4f4f1; border-radius: 6px; padding: 8px 10px;
  }
  .tool-card .status {
    display: inline-block; margin-top: 8px; font-size: 11px; letter-spacing: 0.07em;
    text-transform: uppercase; color: #8a6d1a;
  }
  .tool-card.finished .status { color: #1f5c1f; }
  .tool-card[data-finished="denied"] .status { color: #8d1d1d; }
  .output-details { margin-top: 8px; }
  .output-details summary { font-size: 12px; color: #6b6f78; cursor: pointer; }
  .output-details .output {
    margin: 6px 0 0; padding: 9px 10px; background: #f4f4f1; border-radius: 6px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  }
  .approval-card {
    display: block; margin: 14px 0; padding: 14px; border: 2px solid #dcb253; border-radius: 10px;
    background: #fffdf3;
  }
  .approval-card.resolved { border-color: #bcd8bc; background: #f4faf4; }
  .approval-card .approval-body { margin-bottom: 8px; font-weight: 600; }
  .approval-card .cmd {
    display: block; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; background: #f7f3e6; border-radius: 6px; padding: 8px 10px;
  }
  .approval-actions { display: flex; gap: 10px; margin-top: 12px; }
  .approval-actions button {
    font: inherit; font-size: 13.5px; padding: 7px 16px; border-radius: 8px;
    border: 1px solid #b6b6b0; background: #fff; cursor: pointer;
  }
  .approval-actions .allow-once { background: #1f5c1f; border-color: #1f5c1f; color: #fff; }
  .approval-actions button:disabled { opacity: 0.45; cursor: default; }
  .approval-result { font-weight: 600; color: #1f5c1f; }
  .approval-card[data-decision="deny"] .approval-result { color: #8d1d1d; }
  .tool-result, .tool-decision, .approval-resolved, .grant-lifecycle, .turn-end, .run-status {
    display: block; padding-left: 2px; font-size: 12px; color: #8b8e96;
    font-variant-numeric: tabular-nums;
  }
  .run-finished { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; color: #1f5c1f; }
  .run-failed { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; color: #8d1d1d; }
  #operator { display: flex; gap: 8px; margin: 14px 0 0; }
  #operator input {
    flex: 1; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #d4d4ce;
    border-radius: 8px; background: #fff;
  }
  #operator button {
    font: inherit; font-size: 13.5px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid #1f5c1f; background: #1f5c1f; color: #fff; cursor: pointer;
  }
  #operator button:disabled { opacity: 0.45; cursor: default; }
  body[data-tab="library"] #operator { display: none; }
  #tabs { display: flex; gap: 6px; margin: 12px 0 0; }
  .tab {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid #d4d4ce; background: #fff; color: #5c6068; cursor: pointer;
  }
  .tab[data-active="true"] { background: #1b1d22; border-color: #1b1d22; color: #fff; }
  #library-note { margin: 14px 0 0; font-size: 12.5px; color: #6b6f78; }
  #library-status { margin: 10px 0 0; font-size: 13px; color: #83878f; }
  #library-status:empty { margin: 0; }
  #library-list { margin-top: 12px; }
  .library-pinned {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 9px 11px;
    border: 1px solid #c8cdc4; border-radius: 8px; background: #f0f4ee; cursor: pointer;
  }
  .library-pinned-note { font: 12px/1.5 ui-sans-serif, -apple-system, sans-serif; color: #6b6f78; }
  .library-group-title {
    margin: 18px 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #83878f;
  }
  .library-group { list-style: none; margin: 0; padding: 0; }
  .library-entry {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%;
    text-align: left; font: inherit; font-size: 13.5px; padding: 8px 11px; margin-bottom: 4px;
    border: 1px solid #dcdcd6; border-radius: 8px; background: #fff; cursor: pointer;
  }
  .library-entry[data-kind="dir"] { font-weight: 600; }
  .library-size { font-size: 12px; color: #83878f; font-variant-numeric: tabular-nums; }
  #library-view { margin-top: 18px; }
  #library-view-path {
    margin: 0; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #5c6068;
  }
  #library-view-text {
    margin: 6px 0 0; padding: 10px; background: #f4f4f1; border-radius: 6px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  }
  #library-view-refused {
    margin: 6px 0 0; padding: 9px 12px; border: 1px solid #e3a1a1; border-radius: 8px;
    background: #fdeeee; color: #8d1d1d; font-size: 13px; font-weight: 600;
  }
  #sidebar-footer { margin-top: 18px; border-top: 1px solid #e2e2dd; padding-top: 12px; }
  #provider-open {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px;
    padding: 8px 10px; border: 1px solid #d4d4ce; border-radius: 8px; background: #fff; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  body[data-page="connect"] #tabs,
  body[data-page="connect"] #operator,
  body[data-page="connect"] #thread,
  body[data-page="connect"] #library,
  body[data-page="connect"] #resume,
  body[data-page="connect"] #error,
  body[data-page="connect"] .meta,
  body[data-page="connect"] #bot-title { display: none; }
  #provider { max-width: 640px; padding: 8px 0 0; }
  #provider[hidden] { display: none; }
  #provider h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.01em; }
  #provider-intro { margin: 0 0 4px; font-size: 13.5px; color: #5c6068; }
  #provider-vault { margin: 0 0 18px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #83878f; }
  #provider-form { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  #provider-form label { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #83878f; }
  #provider-form input {
    font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid #d4d4ce;
    border-radius: 8px; background: #fff; margin-bottom: 8px;
  }
  #provider-save, #provider-continue {
    align-self: flex-start; font: inherit; font-size: 13.5px; padding: 9px 18px; border-radius: 8px;
    border: 1px solid #1f5c1f; background: #1f5c1f; color: #fff; cursor: pointer;
  }
  #provider-save:disabled { opacity: 0.45; cursor: default; }
  #provider-continue[hidden] { display: none; }
  #provider-replaces {
    margin: 12px 0 0; padding: 9px 12px; border: 1px solid #dcb253; border-radius: 8px;
    background: #fffdf3; color: #6b5115; font-size: 12.5px;
  }
  #provider-replaces[hidden] { display: none; }
  #provider-request {
    margin: 14px 0 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #5c6068;
  }
  #provider-status { margin: 6px 0 0; font-size: 13px; color: #83878f; }
  #provider-answer {
    margin: 10px 0 0; padding: 10px 12px; border: 1px solid #bcd8bc; border-radius: 8px;
    background: #f0f7f0; color: #1f5c1f; font-size: 13px; white-space: pre-wrap;
  }
  #provider-answer[hidden] { display: none; }
  #provider-refusal {
    margin: 10px 0 0; padding: 10px 12px; border: 1px solid #e3a1a1; border-radius: 8px;
    background: #fdeeee; color: #8d1d1d; font-size: 13px; font-weight: 600;
  }
  #provider-refusal[hidden] { display: none; }
  #provider-capabilities {
    margin: 12px 0 0; padding-left: 18px; font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; color: #5c6068;
  }
  #provider-capabilities[hidden] { display: none; }
  #provider-replay {
    margin: 22px 0 0; font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid #d4d4ce; background: #fff; color: #5c6068; cursor: pointer;
  }
  #provider-replay-note { margin: 8px 0 0; font-size: 12px; color: #83878f; }
  #provider-key-kept { margin: 14px 0 0; font-size: 12px; color: #83878f; }
</style>
</head>
<body>
<div class="shell" data-operator="false">
  <aside id="sidebar" hidden>
    <h2 id="sidebar-title">Bots</h2>
    <div id="bot-list"></div>
    <input id="new-bot-name" type="text" autocomplete="off">
    <button id="new-bot" type="button"></button>
    <section id="threads">
      <h2 id="threads-title">Threads</h2>
      <p id="threads-bot"></p>
      <div id="thread-list"></div>
      <button id="new-thread" type="button"></button>
    </section>
    <footer id="sidebar-footer">
      <button id="provider-open" type="button" data-provider-status=""></button>
    </footer>
  </aside>
  <section id="center">
  <header>
    <h1>freebot</h1>
    <p>One thread. Local run. A real model when the vault holds a key, the committed replay when it does not.</p>
    <p id="bot-title"></p>
    <div class="meta">
      <span id="conn" data-connection="connecting">connecting</span>
      <span id="run"></span>
      <span id="lastseq" data-last-seq="0">last seq 0</span>
      <span id="dups" data-duplicates-ignored="0">duplicates ignored: 0</span>
    </div>
  </header>
  <div id="resume" hidden></div>
  <div id="error" hidden></div>
  <section id="provider" hidden data-provider-state="empty" data-provider-page="false">
    <h2 id="provider-headline"></h2>
    <p id="provider-intro"></p>
    <p id="provider-vault"></p>
    <form id="provider-form">
      <label id="provider-base-url-label" for="provider-base-url"></label>
      <input id="provider-base-url" type="text" autocomplete="off" spellcheck="false">
      <label id="provider-model-label" for="provider-model"></label>
      <input id="provider-model" type="text" autocomplete="off" spellcheck="false">
      <label id="provider-key-label" for="provider-key"></label>
      <input id="provider-key" type="password" autocomplete="off" spellcheck="false">
      <button id="provider-save" type="submit"></button>
      <button id="provider-continue" type="button" hidden></button>
    </form>
    <p id="provider-replaces" hidden></p>
    <p id="provider-request" data-endpoint=""></p>
    <p id="provider-status"></p>
    <p id="provider-answer" hidden></p>
    <p id="provider-refusal" hidden></p>
    <ul id="provider-capabilities" hidden></ul>
    <p id="provider-key-kept"></p>
    <button id="provider-replay" type="button"></button>
    <p id="provider-replay-note"></p>
  </section>
  <nav id="tabs">
    <button id="tab-conversation" class="tab" type="button" data-tab="conversation" data-active="true" aria-current="true">Conversation</button>
    <button id="tab-library" class="tab" type="button" data-tab="library" data-active="false" aria-current="false">Library</button>
  </nav>
  <form id="operator" hidden>
    <input id="prompt" type="text" placeholder="what should the bot do?" autocomplete="off">
    <button id="start" type="submit">Start run</button>
  </form>
  <main id="thread"><p class="idle" id="idle-note">Waiting for the run to start.</p></main>
  <section id="library" hidden data-library-state="idle">
    <p id="library-note"></p>
    <p id="library-status" data-library-status="idle"></p>
    <div id="library-list"></div>
    <section id="library-view" hidden>
      <p id="library-view-path" data-path=""></p>
      <pre id="library-view-text" data-path=""></pre>
      <p id="library-view-refused" hidden data-refusal=""></p>
    </section>
  </section>
  </section>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
